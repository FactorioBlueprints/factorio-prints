name: Deploy to Firebase Production

on:
  push:
    branches:
      - factorio-prints.com

concurrency:
  group: deploy-firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Run tests and checks
        run: |
          just test-ci check

      - name: Build for production
        run: just build-ci
        env:
          NODE_ENV: production
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ENVIRONMENT: production-firebase
          SENTRY_RELEASE: ${{ github.sha }}
          VITE_IMAGE_GATEWAY_ORIGIN: https://images.factorioprints.com

      - name: Verify Cloud Functions
        run: npm run verify:functions

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Deploy to Firebase
        run: |
          npm run deploy:all -- --project facorio-blueprints
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
