name: Deploy to Firebase Production

on:
  push:
    branches:
      - factorio-prints.com

concurrency:
  group: deploy-firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4.2.5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Run tests and checks
        run: |
          just test-ci check

      - name: Build for production
        run: just build-ci
        env:
          NODE_ENV: production
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ENVIRONMENT: production-firebase
          SENTRY_RELEASE: ${{ github.sha }}
          VITE_IMAGE_GATEWAY_ORIGIN: https://images.factorioprints.com

      - name: Verify Cloud Functions
        run: npm run verify:functions

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Deploy to Firebase
        run: |
          npm run deploy:all -- --project facorio-blueprints
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
