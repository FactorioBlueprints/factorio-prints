name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - factorio.school
  pull_request:
    branches:
      - main
      - factorio.school

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4.3.0

      - uses: pnpm/action-setup@v6.0.10

      - name: Build
        run: just build-ci

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=factorio-prints --branch=${{ github.head_ref || github.ref_name }}
