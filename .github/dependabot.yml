version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 25
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    # Renovate's "vite-plus monorepo" group owns vite-plus so its vite alias moves with it.
    ignore:
      - dependency-name: "vite-plus"
    # Only group dependencies that must move in lockstep. typescript was a
    # single-package group, so it gets its own PR either way -- dropped so a
    # breaking bump is labelled by name rather than hidden behind a group.
    groups:
      fontawesome:
        patterns:
          - "@fortawesome/*"
      vite-ecosystem:
        patterns:
          - "vite"
          - "@vitejs/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "playwright"
      # Listed explicitly rather than as "react-*", which also matched the
      # firebase group's "react-firebase-*" and left the winning group ambiguous.
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      tanstack:
        patterns:
          - "@tanstack/*"
      firebase:
        patterns:
          - "firebase"
          - "firebase-*"
          - "react-firebase-*"
    commit-message:
      prefix: "dependabot"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 25
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    groups:
      firebase:
        patterns:
          - "firebase"
          - "firebase-*"
          - "react-firebase-*"
    commit-message:
      prefix: "dependabot"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 25
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "dependabot"
      include: "scope"
