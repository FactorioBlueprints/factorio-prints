version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 25
    labels:
      - "dependencies"
    groups:
      typescript-ecosystem:
        patterns:
          - "typescript"
          - "@types/*"
      testing:
        patterns:
          - "@testing-library/*"
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "react-*"
      tanstack:
        patterns:
          - "@tanstack/*"
      firebase:
        patterns:
          - "firebase"
          - "firebase-*"
          - "re-base"
      fortawesome:
        patterns:
          - "@fortawesome/*"
      sentry:
        patterns:
          - "@sentry/*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
    commit-message:
      prefix: "dependabot"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 25
    labels:
      - "dependencies"
    commit-message:
      prefix: "dependabot"
      include: "scope"
